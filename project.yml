name: VideoCacheApp
options:
  bundleIdPrefix: com.videocache
  deploymentTarget:
    iOS: "15.0"
  projectReferences: {}

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.videocache.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    UI_USER_INTERFACE_IDIOM: "1"
    INFOPLIST_FILE: VideoCacheApp/Info.plist

targets:
  VideoCacheApp:
    type: application
    platform: iOS
    sources:
      - VideoCacheApp
    settings:
      base:
        PRODUCT_NAME: VideoCacheApp
        PRODUCT_BUNDLE_IDENTIFIER: com.videocache.app
        CODE_SIGN_ENTITLEMENTS: VideoCacheApp/VideoCacheApp.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "NO"
